      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function shareTextFile(filename, html, shareTitle) {
    var blob = new Blob([html], { type: "text/html;charset=utf-8" });
    var canTryShare = false;
    var file = null;
    if (window.isSecureContext !== false && navigator.share && navigator.canShare) {
      try {
        file = new File([blob], filename, { type: "text/html" });
        canTryShare = navigator.canShare({ files: [file] });
      } catch (e) {
        canTryShare = false;
      }
    }
    if (canTryShare) {
      navigator.share({ files: [file], title: shareTitle || filename }).catch(function (err) {
        if (!err || err.name !== "AbortError") {
          showToast("Le partage a échoué.");
        }
      });
    } else {
      showToast("Le partage direct n'est pas disponible sur ce navigateur.");
    }
  }

  function buildListExport() {
    var listItems = getListItems();
    if (listItems.length === 0) return null;
    var catalogIndexById = {};
    state.catalog.forEach(function (p, idx) { catalogIndexById[p.id] = idx; });
    var groups = state.rayons.map(function (r) {
      return {
        name: r.name,
        color: r.color,
        items: listItems.filter(function (i) { return i.product.rayonId === r.id; })
          .slice()
          .sort(function (a, b) { return (catalogIndexById[a.productId] || 0) - (catalogIndexById[b.productId] || 0); })
          .map(function (i) { return { name: i.product.name, note: i.note, checked: i.checked }; })
      };
    }).filter(function (g) { return g.items.length > 0; });
    var now = new Date();
    var dateLabel = now.toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric", hour: "2-digit", minute: "2-digit" });
    var html = buildExportHtml("Ma liste de courses", dateLabel, groups, state.listNote);
    return { filename: "liste-de-courses-" + now.toISOString().slice(0, 10) + ".html", text: html, title: "Ma liste de courses" };
  }

  function shareList() {
    var out = buildListExport();
    if (out) shareTextFile(out.filename, out.text, out.title);
  }

  function buildArchiveExport(a) {
    var dateLabel = new Date(a.date).toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric", hour: "2-digit", minute: "2-digit" });
    var order = state.rayons.map(function (r) { return r.name; });
    var byName = {};
    a.items.forEach(function (it) {
      var key = it.rayon || "";
      if (!byName[key]) byName[key] = [];
      byName[key].push(it);
    });
    var names = Object.keys(byName).sort(function (x, y) {
      var ix = order.indexOf(x), iy = order.indexOf(y);
      return (ix === -1 ? 999 : ix) - (iy === -1 ? 999 : iy);
    });
    function colorFor(name) {
      var r = state.rayons.find(function (r) { return r.name === name; });
      return r ? r.color : "#5C7A8A";
    }
    var groups = names.map(function (n) {
      var items = sortArchiveEntriesByCatalog(byName[n], function (it) { return it.name; });
      return { name: n || "Autre", color: colorFor(n), items: items };
    });
    var html = buildExportHtml("Liste de courses archivée", dateLabel, groups, a.note);
    return { filename: "liste-de-courses-" + a.date.slice(0, 10) + ".html", text: html, title: "Liste de courses archivée" };
  }

  function shareArchive(a) {
    var out = buildArchiveExport(a);
    shareTextFile(out.filename, out.text, out.title);
  }

  function showToast(msg) {
    ui.toastMsg = msg;
    render();
    setTimeout(function () { ui.toastMsg = ""; render(); }, 3000);
  }

  /* ---------- Persistance ---------- */
  // Historique : plusieurs migrations incrémentales (fusion + suppression + couleurs) se sont
  // empilées et ont fini par créer des doublons et des rayons mal placés après plusieurs cycles
  // d'import/export sur un même appareil. On remplace désormais entièrement rayons + catalogue
  // par les valeurs de référence ci-dessus à chaque montée de version, plutôt que de les fusionner.
  // La liste active, les notes et les archives ne sont pas touchées.
  function resetCatalogToDefaults() {
    state.rayons = DEFAULT_RAYONS.map(function (r) { return { id: r.id, name: r.name, color: r.color }; });
    state.catalog = DEFAULT_CATALOG.map(function (p) { return { id: p.id, name: p.name, rayonId: p.rayonId }; });
  }

  function load() {
    storage.get(STORAGE_KEY).then(function (res) {
      if (res && res.value) {
        try {
          var parsed = JSON.parse(res.value);
          if (parsed.rayons) state.rayons = parsed.rayons;
          if (parsed.catalog) state.catalog = parsed.catalog;
          if (parsed.pieces) state.pieces = parsed.pieces;
          if (parsed.savedConfigs) state.savedConfigs = parsed.savedConfigs;
          if (parsed.selectionStatus) state.selectionStatus = parsed.selectionStatus;
          if (parsed.activeRayonConfigId) state.activeRayonConfigId = parsed.activeRayonConfigId;
          if (parsed.activePieceConfigId) state.activePieceConfigId = parsed.activePieceConfigId;
          if (parsed.list) state.list = parsed.list;
          if (parsed.notes) {
            state.notes = parsed.notes;
          } else if (parsed.list) {
            var migrated = {};
            parsed.list.forEach(function (i) { if (i.note) migrated[i.productId] = i.note; });
            state.notes = migrated;
          }
          if (typeof parsed.listNote === "string") state.listNote = parsed.listNote;
          if (parsed.archives) state.archives = parsed.archives;
          state.catalogVersion = typeof parsed.catalogVersion === "number" ? parsed.catalogVersion : 0;
        } catch (e) { /* données absentes ou invalides, on garde les valeurs par défaut */ }
      }
    }).catch(function () { /* pas de données existantes */ }).finally(function () {
      if ((state.catalogVersion || 0) < CATALOG_VERSION) {
        resetCatalogToDefaults();
        state.catalogVersion = CATALOG_VERSION;
        scheduleSave();
      }
      ui.loaded = true;
      render();
    });
  }

  function scheduleSave() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      storage.set(STORAGE_KEY, JSON.stringify(state)).then(function (result) {
        ui.error = result ? "" : "La sauvegarde a échoué.";
        renderError();
      }).catch(function () {
        ui.error = "La sauvegarde a échoué.";
        renderError();
      });
    }, 300);
  }

  /* ---------- Actions ---------- */
  function rayonById(id) {
    for (var i = 0; i < state.rayons.length; i++) if (state.rayons[i].id === id) return state.rayons[i];
    return null;
  }

  // Ordre actuel du catalogue par nom de produit (insensible à la casse) : sert à
  // réaligner l'ordre des articles des listes archivées/partagées sur celui du
  // catalogue actuel, même si l'archive a été enregistrée avant un réordonnancement.
  function catalogNameOrderMap() {
    var map = {};
    state.catalog.forEach(function (p, idx) { map[p.name.toLowerCase()] = idx; });
    return map;
  }

  function sortArchiveEntriesByCatalog(entries, getName) {
    var nameOrder = catalogNameOrderMap();
    return entries.slice().sort(function (a, b) {
      var na = getName(a).toLowerCase();
      var nb = getName(b).toLowerCase();
      var ia = nameOrder.hasOwnProperty(na) ? nameOrder[na] : 999999;
      var ib = nameOrder.hasOwnProperty(nb) ? nameOrder[nb] : 999999;
      return ia - ib;
    });
  }

  function toggleInList(productId) {
    var idx = state.list.findIndex(function (i) { return i.productId === productId; });
    if (idx >= 0) state.list.splice(idx, 1);
    else state.list.push({ productId: productId, checked: false });
    scheduleSave();
    render();
  }

  // Cycle de sélection à 4 états sur les articles du catalogue (Rayons/Pièces) :
  // vierge -> sélectionné (dans la liste) -> exclu -> incertain -> vierge...
  // Seul l'état "sélectionné" fait partie de la liste de courses ; les autres
  // états sont de simples annotations visuelles dans le catalogue.
  function getSelectionStatus(productId) {
    var status = state.selectionStatus[productId];
    if (status) return status;
    return state.list.some(function (i) { return i.productId === productId; }) ? "want" : "none";
  }

  function cycleSelectionStatus(productId) {
    var current = getSelectionStatus(productId);
    // Cycle à 3 états sans retour à vierge : caddie -> barré -> point d'interrogation -> caddie...
    // L'état vierge n'existe que pour un article jamais encore tapoté.
    var next = current === "none" ? "want" : current === "want" ? "excluded" : current === "excluded" ? "maybe" : "want";
    state.selectionStatus[productId] = next;
    var idx = state.list.findIndex(function (i) { return i.productId === productId; });
    if (next === "want") {
      if (idx === -1) state.list.push({ productId: productId, checked: false });
    } else if (idx >= 0) {
      state.list.splice(idx, 1);
    }
    scheduleSave();
    render();
  }

  function selectionCircleHtml(productId, size, fontSize) {
    var status = getSelectionStatus(productId);
    var bg = "#F1F4EE", border = "1px solid #D6DBD0", content = "";
    if (status === "want") { bg = "#1E4632"; border = "none"; content = "\uD83D\uDED2"; }
    else if (status === "excluded") { bg = "#C1483D"; border = "none"; content = '<span style="color:#fff;font-weight:700;">\u2715</span>'; }
    else if (status === "maybe") { bg = "#3E8FB0"; border = "none"; content = '<span style="color:#fff;font-weight:700;">?</span>'; }
    return '<span style="width:' + size + 'px;height:' + size + 'px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:' + bg + ";border:" + border + ";font-size:" + fontSize + 'px;line-height:1;">' + content + "</span>";
  }

  function selectionNameStyle(productId) {
    var status = getSelectionStatus(productId);
    if (status === "want") return "color:#1E7A46;";
    if (status === "excluded") return "color:#94998f;text-decoration:line-through;";
    if (status === "maybe") return "color:#3E8FB0;";
    return "";
  }

  function isListComplete() {
    return state.list.length > 0 && state.list.every(function (i) { return i.checked; });
  }

  function celebrate() {
    if (document.getElementById("celebrationOverlay")) return;
    var colors = ["#3C8B5C", "#C1483D", "#C99A2E", "#7A5CB0", "#2F9E9E", "#C9598A", "#3E8FB0"];
    var overlay = document.createElement("div");
    overlay.id = "celebrationOverlay";
    overlay.style.cssText = "position:fixed;inset:0;z-index:9999;overflow:hidden;";
    document.body.appendChild(overlay);

    function spawnBatch(count) {
      for (var i = 0; i < count; i++) {
        var piece = document.createElement("div");
        var color = colors[Math.floor(Math.random() * colors.length)];
        var left = Math.random() * 100;
        var delay = Math.random() * 0.4;
        var duration = 2.2 + Math.random() * 1.6;
        var size = 6 + Math.random() * 6;
        var rotate = Math.random() * 360;
        piece.style.cssText = "position:absolute;top:-20px;left:" + left + "%;width:" + size + "px;height:" + (size * 0.4) + "px;background:" + color + ";opacity:.9;transform:rotate(" + rotate + "deg);animation:confetti-fall " + duration + "s ease-in " + delay + "s forwards;border-radius:2px;";
        overlay.appendChild(piece);
        setTimeout(function (p) { return function () { if (p.parentNode) p.parentNode.removeChild(p); }; }(piece), (delay + duration) * 1000 + 200);
      }
    }
    spawnBatch(60);
    var spawnInterval = setInterval(function () { spawnBatch(22); }, 650);

    var msg = document.createElement("div");
    msg.style.cssText = "position:absolute;top:40%;left:50%;background:linear-gradient(135deg,#1E4632,#2C7350);color:#fff;padding:clamp(16px,4.5vw,26px) clamp(18px,5.5vw,30px);border-radius:18px;font-family:'Archivo Black',Inter,sans-serif;font-size:clamp(16px,5.2vw,22px);line-height:1.35;text-align:center;box-shadow:0 12px 34px rgba(0,0,0,.32);border:2px solid rgba(255,217,102,.55);opacity:0;animation:celebration-pop .4s ease-out .15s forwards;width:min(88vw,360px);cursor:pointer;";
    msg.innerHTML = "\uD83C\uDF89 Bravo ! Tu as terminé les courses ! \uD83C\uDF89<div style=\"font-family:'Inter',sans-serif;font-size:clamp(12.5px,3.8vw,15px);font-weight:700;color:#FFD966;margin-top:10px;letter-spacing:.2px;\">Maintenant tu peux passer à la caisse et faire chauffer la CB ! \uD83D\uDCB3</div>";
    overlay.appendChild(msg);

    var lastCelebrationTap = 0;
    overlay.addEventListener("click", function () {
      var now = Date.now();
      if (now - lastCelebrationTap < 400) {
        clearInterval(spawnInterval);
        overlay.remove();
      }
      lastCelebrationTap = now;
    });
  }

  function toggleChecked(productId) {
    var item = state.list.find(function (i) { return i.productId === productId; });
    if (!item) return;
    var wasComplete = isListComplete();
    item.checked = !item.checked;
    scheduleSave();
    render();
    if (!wasComplete && isListComplete()) celebrate();
  }

  function updateNote(productId, note) {
    state.notes[productId] = note;
    scheduleSave();
  }

  function resetList() {
    state.list = [];
    state.notes = {};
    state.listNote = "";
    state.selectionStatus = {};
    ui.confirmReset = false;
    scheduleSave();
    render();
  }

  function renderConfirmResetBanner() {
    if (!ui.confirmReset) return "";
    return '<div style="background:#fff;border:1px solid #C1483D;border-radius:10px;padding:12px;margin-bottom:14px;">' +
      '<div style="font-size:13px;margin-bottom:10px;">Vider la liste de courses et réinitialiser la sélection de tous les articles du catalogue (caddie, barré, point d\'interrogation) ? Cette action ne peut pas être annulée (pense à archiver avant si besoin).</div>' +
      '<div style="display:flex;gap:8px;">' +
      '<button data-action="confirm-reset-yes" style="flex:1;padding:8px 10px;background:#C1483D;color:#fff;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;">Confirmer</button>' +
      '<button data-action="confirm-reset-no" style="padding:8px 14px;background:#fff;color:#5f6b62;border:1px solid #D6DBD0;border-radius:6px;font-size:13px;cursor:pointer;">Annuler</button>' +
      "</div></div>";
  }

  function archiveList() {
    var items = getListItems();
    if (items.length === 0) return;
    var catalogIndexById = {};
    state.catalog.forEach(function (p, idx) { catalogIndexById[p.id] = idx; });
    var orderedItems = items.slice().sort(function (a, b) {
      return (catalogIndexById[a.productId] || 0) - (catalogIndexById[b.productId] || 0);
    });
    var snapshot = {
      id: uid("a"),
      date: new Date().toISOString(),
      note: state.listNote,
      items: orderedItems.map(function (i) {
        var r = rayonById(i.product.rayonId);
        return { name: i.product.name, rayon: r ? r.name : "", note: state.notes[i.product.id] || "", checked: i.checked };
      })
    };
    state.archives.unshift(snapshot);
    ui.archiveMsg = "Liste archivée !";
    scheduleSave();
    render();
    setTimeout(function () { ui.archiveMsg = ""; render(); }, 2000);
  }

  function deleteArchive(id) {
    state.archives = state.archives.filter(function (a) { return a.id !== id; });
    scheduleSave();
    render();
  }

  function deleteProduct(productId) {
    state.catalog = state.catalog.filter(function (p) { return p.id !== productId; });
    state.list = state.list.filter(function (i) { return i.productId !== productId; });
    delete state.notes[productId];
    scheduleSave();
    render();
  }

  function reorderRayons(orderedIds) {
    var byId = {};
    state.rayons.forEach(function (r) { byId[r.id] = r; });
    var reordered = orderedIds.map(function (id) { return byId[id]; }).filter(Boolean);
    // conserve tout rayon qui n'aurait pas été inclus (sécurité)
    state.rayons.forEach(function (r) { if (reordered.indexOf(r) === -1) reordered.push(r); });
    state.rayons = reordered;
    scheduleSave();
    render();
  }

  function addRayon(name) {
    name = (name || "").trim();
    if (!name) return null;
    var idx = state.rayons.length % PALETTE.length;
    var rayon = { id: uid("r"), name: name, color: PALETTE[idx] };
    state.rayons.push(rayon);
    scheduleSave();
    return rayon;
  }

  function moveRayon(index, dir) {
    var j = index + dir;
    if (j < 0 || j >= state.rayons.length) return;
    var tmp = state.rayons[index];
    state.rayons[index] = state.rayons[j];
    state.rayons[j] = tmp;
    scheduleSave();
    render();
  }

  function renameRayon(id, name) {
    var r = rayonById(id);
    if (r) r.name = name;
    scheduleSave();
  }

  function renameProduct(id, name) {
    var p = state.catalog.find(function (p) { return p.id === id; });
    if (p) p.name = name;
    scheduleSave();
  }

  function updateRayonColor(id, color) {
    var r = rayonById(id);
    if (r) r.color = color;
    scheduleSave();
    render();
  }

  function deleteRayon(id) {
    state.rayons = state.rayons.filter(function (r) { return r.id !== id; });
    ui.confirmDeleteRayon = null;
    scheduleSave();
    render();
  }

  function changeProductRayon(productId, rayonId) {
    var p = state.catalog.find(function (p) { return p.id === productId; });
    if (p) p.rayonId = rayonId;
    scheduleSave();
    render();
  }

  function reorderProductsInRayon(rayonId, orderedIds) {
    var indices = [];
    state.catalog.forEach(function (p, idx) { if (p.rayonId === rayonId) indices.push(idx); });
    var byId = {};
    state.catalog.forEach(function (p) { if (p.rayonId === rayonId) byId[p.id] = p; });
    var reordered = orderedIds.map(function (id) { return byId[id]; }).filter(Boolean);
    indices.forEach(function (idx, i) { if (reordered[i]) state.catalog[idx] = reordered[i]; });
    scheduleSave();
    render();
  }

  /* ---------- Pièces de la maison (classement alternatif du catalogue) ---------- */
  function pieceById(id) {
    for (var i = 0; i < state.pieces.length; i++) if (state.pieces[i].id === id) return state.pieces[i];
    return null;
  }

  function addPiece(name) {
    name = (name || "").trim();
    if (!name) return null;
    var idx = state.pieces.length % PALETTE.length;
    var piece = { id: uid("pc"), name: name, color: PALETTE[idx] };
    state.pieces.push(piece);
    scheduleSave();
    return piece;
  }

  function renamePiece(id, name) {
    var pc = pieceById(id);
    if (pc) pc.name = name;
    scheduleSave();
  }

  function updatePieceColor(id, color) {
    var pc = pieceById(id);
    if (pc) pc.color = color;
    scheduleSave();
    render();
  }

  function movePiece(index, dir) {
    var j = index + dir;
    if (j < 0 || j >= state.pieces.length) return;
    var tmp = state.pieces[index];
    state.pieces[index] = state.pieces[j];
    state.pieces[j] = tmp;
    scheduleSave();
    render();
  }

  function deletePiece(id) {
    state.catalog.forEach(function (p) { if (p.pieceId === id) p.pieceId = null; });
    state.pieces = state.pieces.filter(function (pc) { return pc.id !== id; });
    ui.confirmDeletePiece = null;
    scheduleSave();
    render();
  }

  function assignProductToPieceEnd(productId, pieceId) {
    var idx = state.catalog.findIndex(function (p) { return p.id === productId; });
    if (idx === -1) return;
    var product = state.catalog[idx];
    product.pieceId = pieceId;
    state.catalog.splice(idx, 1);
    var lastIdx = -1;
    state.catalog.forEach(function (p, i) {
      var pid = p.pieceId || null;
      if (pid === (pieceId || null)) lastIdx = i;
    });
    state.catalog.splice(lastIdx + 1, 0, product);
    scheduleSave();
    render();
  }

  // Utilisée par les menus déroulants (contrairement au glisser-déposer, ne change pas
  // la position de l'article dans le catalogue — évite de perturber l'autre vue).
  function setProductPiece(productId, pieceId) {
    var p = state.catalog.find(function (p) { return p.id === productId; });
    if (!p) return;
    p.pieceId = pieceId;
    scheduleSave();
    render();
  }

  function reorderProductsInPiece(pieceId, orderedIds) {
    var key = pieceId || null;
    var indices = [];
    state.catalog.forEach(function (p, idx) { if ((p.pieceId || null) === key) indices.push(idx); });
    var byId = {};
    state.catalog.forEach(function (p) { if ((p.pieceId || null) === key) byId[p.id] = p; });
    var reordered = orderedIds.map(function (id) { return byId[id]; }).filter(Boolean);
    indices.forEach(function (idx, i) { if (reordered[i]) state.catalog[idx] = reordered[i]; });
    scheduleSave();
    render();
  }

  /* ---------- Configurations sauvegardées localement ---------- */
  function saveCurrentConfig(name, type) {
    name = (name || "").trim();
    if (!name) return;
    if (type === "rayons") {
      var productsRayons = state.catalog.map(function (p) {
        var r = rayonById(p.rayonId);
        return { name: p.name, rayon: r ? r.name : null };
      });
      var cfgR = {
        id: uid("cfg"),
        type: "rayons",
        name: name,
        savedAt: new Date().toISOString(),
        rayons: JSON.parse(JSON.stringify(state.rayons)),
        products: productsRayons
      };
      state.savedConfigs.push(cfgR);
      state.activeRayonConfigId = cfgR.id;
    } else if (type === "pieces") {
      var productsPieces = state.catalog.map(function (p) {
        var pc = pieceById(p.pieceId);
        return { name: p.name, piece: pc ? pc.name : null };
      });
      var cfgP = {
        id: uid("cfg"),
        type: "pieces",
        name: name,
        savedAt: new Date().toISOString(),
        pieces: JSON.parse(JSON.stringify(state.pieces)),
        products: productsPieces
      };
      state.savedConfigs.push(cfgP);
      state.activePieceConfigId = cfgP.id;
    } else {
      return;
    }
    scheduleSave();
    render();
    showToast("Configuration \u00ab " + name + " \u00bb enregistrée !");
  }

  function loadConfig(id) {
    var cfg = state.savedConfigs.find(function (c) { return c.id === id; });
    if (!cfg) return;
    if (cfg.type === "rayons") {
      var oldRayonNameById = {};
      state.rayons.forEach(function (r) { oldRayonNameById[r.id] = r.name; });
      state.rayons = JSON.parse(JSON.stringify(cfg.rayons));

      var byNameCurrent = {};
      state.catalog.forEach(function (p) { byNameCurrent[p.name.toLowerCase()] = p; });
      var mapByName = {};
      cfg.products.forEach(function (entry) { mapByName[entry.name.toLowerCase()] = entry; });

      // Réaffecte les produits déjà présents
      state.catalog.forEach(function (p) {
        var entry = mapByName[p.name.toLowerCase()];
        var targetName = entry ? entry.rayon : oldRayonNameById[p.rayonId];
        var r = targetName ? state.rayons.find(function (x) { return x.name.toLowerCase() === targetName.toLowerCase(); }) : null;
        p.rayonId = r ? r.id : state.rayons[0].id;
      });
      // Rétablit les produits supprimés depuis l'enregistrement
      var restored = 0;
      cfg.products.forEach(function (entry) {
        if (byNameCurrent[entry.name.toLowerCase()]) return;
        var r = entry.rayon ? state.rayons.find(function (x) { return x.name.toLowerCase() === entry.rayon.toLowerCase(); }) : null;
        state.catalog.push({ id: uid("p"), name: entry.name, rayonId: r ? r.id : state.rayons[0].id, pieceId: null });
        restored++;
      });
      state.activeRayonConfigId = cfg.id;
      showToast("Configuration \u00ab " + cfg.name + " \u00bb chargée" + (restored > 0 ? " (" + restored + " article(s) rétabli(s))" : "") + ".");
    } else if (cfg.type === "pieces") {
      var oldPieceNameById = {};
      state.pieces.forEach(function (pc) { oldPieceNameById[pc.id] = pc.name; });
      state.pieces = JSON.parse(JSON.stringify(cfg.pieces));

      var byNameCurrentP = {};
      state.catalog.forEach(function (p) { byNameCurrentP[p.name.toLowerCase()] = p; });
      var mapByNameP = {};
      cfg.products.forEach(function (entry) { mapByNameP[entry.name.toLowerCase()] = entry; });

      state.catalog.forEach(function (p) {
        var entry = mapByNameP[p.name.toLowerCase()];
        var targetName = entry ? entry.piece : (p.pieceId ? oldPieceNameById[p.pieceId] : null);
        var pc = targetName ? state.pieces.find(function (x) { return x.name.toLowerCase() === targetName.toLowerCase(); }) : null;
        p.pieceId = pc ? pc.id : null;
      });
      var restoredP = 0;
      cfg.products.forEach(function (entry) {
        if (byNameCurrentP[entry.name.toLowerCase()]) return;
        var pc = entry.piece ? state.pieces.find(function (x) { return x.name.toLowerCase() === entry.piece.toLowerCase(); }) : null;
        state.catalog.push({ id: uid("p"), name: entry.name, rayonId: state.rayons[0].id, pieceId: pc ? pc.id : null });
        restoredP++;
      });
      state.activePieceConfigId = cfg.id;
      showToast("Configuration \u00ab " + cfg.name + " \u00bb chargée" + (restoredP > 0 ? " (" + restoredP + " article(s) rétabli(s))" : "") + ".");
    } else {
      return;
    }
    ui.confirmDeleteConfig = null;
    scheduleSave();
    render();
  }

  function deleteConfig(id) {
    state.savedConfigs = state.savedConfigs.filter(function (c) { return c.id !== id; });
    if (state.activeRayonConfigId === id) state.activeRayonConfigId = null;
    if (state.activePieceConfigId === id) state.activePieceConfigId = null;
    ui.confirmDeleteConfig = null;
    scheduleSave();
    render();
  }

  // Bouton "Enregistrer" simple : écrase la configuration actuellement chargée pour cet
  // onglet si elle existe encore, sinon en crée une nouvelle avec un nom généré automatiquement.
  function quickSaveConfig(type) {
    var activeId = type === "rayons" ? state.activeRayonConfigId : state.activePieceConfigId;
    var existing = activeId ? state.savedConfigs.find(function (c) { return c.id === activeId && c.type === type; }) : null;
    if (existing) {
      if (type === "rayons") {
        existing.rayons = JSON.parse(JSON.stringify(state.rayons));
        existing.products = state.catalog.map(function (p) {
          var r = rayonById(p.rayonId);
          return { name: p.name, rayon: r ? r.name : null };
        });
      } else {
        existing.pieces = JSON.parse(JSON.stringify(state.pieces));
        existing.products = state.catalog.map(function (p) {
          var pc = pieceById(p.pieceId);
          return { name: p.name, piece: pc ? pc.name : null };
        });
      }
      existing.savedAt = new Date().toISOString();
      scheduleSave();
      render();
      showToast("Configuration \u00ab " + existing.name + " \u00bb mise à jour.");
    } else {
      var autoName = (type === "rayons" ? "Rayons" : "Pièces") + " – " + new Date().toLocaleDateString("fr-FR", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
      saveCurrentConfig(autoName, type);
    }
  }

  function submitNewProduct() {
    var nameInput = document.getElementById("newProductName");
    var name = nameInput ? nameInput.value.trim() : "";
    if (!name) return;
    var sel = document.getElementById("newProductRayonSelect");
    var rayonId = sel ? sel.value : state.rayons[0].id;
    var pSel = document.getElementById("newProductPieceSelect");
    var pieceId = pSel && pSel.value ? pSel.value : null;
    state.catalog.push({ id: uid("p"), name: name, rayonId: rayonId, pieceId: pieceId });
    ui.showAdd = false;
    scheduleSave();
    render();
  }

  /* ---------- Dérivés ---------- */
  function getListItems() {
    return state.list
      .map(function (i) {
        var product = state.catalog.find(function (p) { return p.id === i.productId; });
        return { productId: i.productId, checked: i.checked, note: state.notes[i.productId] || "", product: product };
      })
      .filter(function (i) { return i.product; });
  }

  function getInListIds() {
    var set = {};
    state.list.forEach(function (i) { set[i.productId] = true; });
    return set;
  }

  /* ---------- Rendu ---------- */
  var appEl;

  function rayonTag(rayon, compact) {
    return '<span class="aisle-tag" style="background:' + rayon.color + ';color:#fff;font-size:' + (compact ? 10 : 12) +
      'px;padding:' + (compact ? "2px 7px" : "4px 10px") + ';border-radius:4px 4px 4px 0;letter-spacing:.4px;display:inline-block;">' +
      esc(rayon.name.toUpperCase()) + "</span>";
  }

  // En-tête de rayon repliable : replié, n'affiche que le nom du rayon et un chiffre
  // (nombre d'articles cochés dans "Ma liste", ou ajoutés à la liste dans le Catalogue).
  function rayonHeaderRow(rayon, count, totalInGroup, collapsed, toggleAction, compact, alwaysShowCount, badges) {
    var badgeHtml = "";
    if (badges) {
      badgeHtml = badges.map(function (b) {
        return '<span style="display:flex;align-items:center;gap:4px;font-size:' + (compact ? 11 : 12) + 'px;background:#fff;padding:2px 8px;border-radius:10px;flex-shrink:0;">' +
          b.iconHtml + '<span style="color:' + b.color + ';font-weight:700;">' + b.count + "</span></span>";
      }).join("");
    } else if (collapsed || alwaysShowCount) {
      badgeHtml = '<span style="font-size:' + (compact ? 11 : 12) + 'px;color:#5f6b62;background:#fff;padding:2px 9px;border-radius:10px;flex-shrink:0;">' + count + "</span>";
    }
    return '<button data-action="' + toggleAction + '" data-id="' + rayon.id + '" style="display:flex;align-items:center;gap:8px;width:100%;background:none;border:none;padding:0;cursor:pointer;text-align:left;">' +
      rayonTag(rayon, compact) +
      badgeHtml +
      '<span style="margin-left:auto;color:#93998D;flex-shrink:0;">' + icon(collapsed ? "chevronDown" : "chevronUp", compact ? 14 : 16) + "</span>" +
      "</button>";
  }

  var CART_BADGE_ICON = '<span style="font-size:12px;line-height:1;">\uD83D\uDED2</span>';
  var MAYBE_BADGE_ICON = '<span style="width:14px;height:14px;border-radius:50%;background:#3E8FB0;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:700;line-height:1;flex-shrink:0;">?</span>';

  // Détermine, selon l'onglet/la vue actuels, quel ensemble de rayons/pièces le bouton
  // "Tout replier/déplier" doit contrôler. Retourne null quand l'action n'a pas de sens
  // ici (ex : onglet Archives, ou Catalogue en mode gestion).
  function collapseAllScope() {
    if (ui.tab === "liste") {
      var listItems = getListItems();
      var ids = state.rayons.filter(function (r) {
        return listItems.some(function (i) { return i.product.rayonId === r.id; });
      }).map(function (r) { return r.id; });
      return { map: ui.collapsedListRayons, ids: ids };
    }
    if (ui.tab === "catalogue" && !ui.manage) {
      if (ui.catalogView === "rayons") {
        var rIds = state.rayons.filter(function (r) {
          return state.catalog.some(function (p) { return p.rayonId === r.id; });
        }).map(function (r) { return r.id; });
        return { map: ui.collapsedCatalogRayons, ids: rIds };
      }
      var pIds = state.pieces.filter(function (pc) {
        return state.catalog.some(function (p) { return p.pieceId === pc.id; });
      }).map(function (pc) { return pc.id; });
      if (state.catalog.some(function (p) { return !p.pieceId || !pieceById(p.pieceId); })) pIds.push("unassigned");
      return { map: ui.collapsedPieces, ids: pIds };
    }
    return null;
  }

  function toggleArchiveItemChecked(archiveId, index) {
    var a = state.archives.find(function (x) { return x.id === archiveId; });
    if (!a || !a.items[index]) return;
    a.items[index].checked = !a.items[index].checked;
    scheduleSave();

  function updateArchiveItemNote(archiveId, index, note) {
    var a = state.archives.find(function (x) { return x.id === archiveId; });
    if (!a || !a.items[index]) return;
    a.items[index].note = note;
    scheduleSave();
  }

  function updateArchiveNote(archiveId, note) {
    var a = state.archives.find(function (x) { return x.id === archiveId; });
    if (!a) return;
    a.note = note;
    scheduleSave();
  }

  function groupArchiveItems(a) {
    var order = state.rayons.map(function (r) { return r.name; });
    var colorByName = {};
    state.rayons.forEach(function (r) { colorByName[r.name] = r.color; });
    var byName = {};
    a.items.forEach(function (it, idx) {
      var key = it.rayon || "";
      if (!byName[key]) byName[key] = [];
      byName[key].push({ item: it, index: idx });
    });
    var names = Object.keys(byName).sort(function (x, y) {
      var ix = order.indexOf(x), iy = order.indexOf(y);
      return (ix === -1 ? 999 : ix) - (iy === -1 ? 999 : iy);
    });
    return names.map(function (n) {
      var entries = sortArchiveEntriesByCatalog(byName[n], function (entry) { return entry.item.name; });
      return { name: n || "Autre", color: colorByName[n] || "#93998D", entries: entries };
    });
  }

    el.style.background = ui.error ? "#C1483D" : "transparent";
    el.style.color = "#fff";
    el.style.fontSize = "12px";
    el.style.padding = ui.error ? "6px 18px" : "0";
  }

  function render() {
    if (!ui.loaded) {
      appEl.innerHTML = '<div style="font-family:Inter,system-ui,sans-serif;padding:40px;text-align:center;color:#4b5a52;">Chargement de la liste…</div>';
      return;
    }
    var main = "";
    if (ui.tab === "liste") main = renderListTab();
    else if (ui.tab === "catalogue") main = renderCatalogueTab();
    else main = renderArchivesTab();

    appEl.innerHTML = renderHeader() +
      '<main style="padding:' + (ui.compact ? "8px 10px 0" : "14px 14px 0") + ';">' + main + "</main>" +
      renderNav();
    autosizeNoteFields();
  }

  /* ---------- Délégation d'événements ---------- */
  function handleClick(e) {
    if (suppressNextRowClick) {
      suppressNextRowClick = false;
      e.preventDefault();
      e.stopPropagation();
      return;
    }
    var el = e.target.closest("[data-action]");
    if (!el) return;
    var action = el.getAttribute("data-action");
    var id = el.getAttribute("data-id");
    switch (action) {
      case "toggle-checked": toggleChecked(id); break;
      case "toggle-in-list": toggleInList(id); break;
      case "cycle-selection": cycleSelectionStatus(id); break;
      case "delete-product": deleteProduct(id); break;
      case "move-rayon": moveRayon(parseInt(el.getAttribute("data-index"), 10), parseInt(el.getAttribute("data-dir"), 10)); break;
      case "delete-rayon":
        if (ui.confirmDeleteRayon === id) {
          ui.confirmDeleteRayon = null;
          render();
        } else {
          var hasProducts = state.catalog.some(function (p) { return p.rayonId === id; });
          if (hasProducts) {
            showToast("Déplace ou supprime d'abord les produits de ce rayon avant de le supprimer.");
          } else if (state.rayons.length <= 1) {
            showToast("Il doit rester au moins un rayon.");
          } else {
            ui.confirmDeleteRayon = id;
            render();
          }
        }
        break;
      case "confirm-delete-rayon-yes": deleteRayon(id); break;
      case "confirm-delete-rayon-no": ui.confirmDeleteRayon = null; render(); break;
      case "set-tab": ui.tab = el.getAttribute("data-tab"); ui.showAdd = false; render(); break;
      case "toggle-manage": ui.manage = !ui.manage; render(); break;
      case "toggle-show-add": ui.showAdd = !ui.showAdd; render(); break;
      case "submit-new-product": submitNewProduct(); break;
      case "cancel-new-product": ui.showAdd = false; render(); break;
      case "archive-list": archiveList(); break;
      case "share-list": shareList(); break;
      case "confirm-reset-open": ui.confirmReset = true; render(); break;
      case "confirm-reset-yes": resetList(); break;
      case "confirm-reset-no": ui.confirmReset = false; render(); break;
      case "toggle-compact": ui.compact = !ui.compact; render(); break;
      case "toggle-collapse-all": toggleCollapseAll(); break;
      case "toggle-list-rayon": ui.collapsedListRayons[id] = !ui.collapsedListRayons[id]; render(); break;
      case "toggle-catalog-rayon": ui.collapsedCatalogRayons[id] = !ui.collapsedCatalogRayons[id]; render(); break;
      case "toggle-piece": ui.collapsedPieces[id] = !ui.collapsedPieces[id]; render(); break;
      case "set-catalog-view": ui.catalogView = el.getAttribute("data-view"); ui.showAdd = false; render(); break;
      case "toggle-show-add-rayon": ui.showAddRayon = !ui.showAddRayon; render(); break;
      case "cancel-new-rayon": ui.showAddRayon = false; render(); break;
      case "submit-new-rayon": {
        var rayonNameInput = document.getElementById("newRayonNameStandalone");
        var rayonNameVal = rayonNameInput ? rayonNameInput.value.trim() : "";
        if (rayonNameVal) {
          addRayon(rayonNameVal);
          ui.showAddRayon = false;
          render();
        }
        break;
      }
      case "toggle-show-add-piece": ui.showAddPiece = !ui.showAddPiece; render(); break;
      case "cancel-new-piece": ui.showAddPiece = false; render(); break;
      case "submit-new-piece": {
        var pieceNameInput = document.getElementById("newPieceNameStandalone");
        var pieceNameVal = pieceNameInput ? pieceNameInput.value.trim() : "";
        if (pieceNameVal) {
          addPiece(pieceNameVal);
          ui.showAddPiece = false;
          render();
        }
        break;
      }
      case "quick-save-config": quickSaveConfig(el.getAttribute("data-config-type")); break;
      case "move-piece": movePiece(parseInt(el.getAttribute("data-index"), 10), parseInt(el.getAttribute("data-dir"), 10)); break;
      case "delete-piece":
        if (ui.confirmDeletePiece === id) {
          ui.confirmDeletePiece = null;
          render();
        } else {
          ui.confirmDeletePiece = id;
          render();
        }
        break;
      case "confirm-delete-piece-yes": deletePiece(id); break;
      case "confirm-delete-piece-no": ui.confirmDeletePiece = null; render(); break;
      case "toggle-config-panel": ui.configPanelOpen = !ui.configPanelOpen; render(); break;
      case "save-config": {
        var cfgNameInput = document.getElementById("newConfigName");
        var cfgName = cfgNameInput ? cfgNameInput.value.trim() : "";
        var cfgType = el.getAttribute("data-config-type");
        if (cfgName) saveCurrentConfig(cfgName, cfgType);
        break;
      }
      case "load-config": loadConfig(id); break;
      case "delete-config":
        if (ui.confirmDeleteConfig === id) { ui.confirmDeleteConfig = null; render(); }
        else { ui.confirmDeleteConfig = id; render(); }
        break;
      case "confirm-delete-config-yes": deleteConfig(id); break;
      case "confirm-delete-config-no": ui.confirmDeleteConfig = null; render(); break;
      case "notes-open": ui.notesOpen = true; render(); break;
      case "toggle-archive": ui.openArchiveId = ui.openArchiveId === id ? null : id; render(); break;
      case "toggle-archive-item": toggleArchiveItemChecked(el.getAttribute("data-archive-id"), parseInt(el.getAttribute("data-item-index"), 10)); break;
      case "toggle-archive-rayon": ui.collapsedArchiveRayons[id] = !ui.collapsedArchiveRayons[id]; render(); break;
      case "delete-archive": deleteArchive(id); break;
      case "share-archive": {
        var arcS = state.archives.find(function (x) { return x.id === id; });
        if (arcS) shareArchive(arcS);
        break;
      }
    }
  }

  function handleInput(e) {
    var t = e.target;
    if (t.hasAttribute("data-note-id")) {
      updateNote(t.getAttribute("data-note-id"), t.value);
      t.style.height = "auto";
      t.style.height = Math.min(t.scrollHeight, 46) + "px";
    } else if (t.hasAttribute("data-archive-note-id")) {
      var parts = t.getAttribute("data-archive-note-id").split("|");
      updateArchiveItemNote(parts[0], parseInt(parts[1], 10), t.value);
      t.style.height = "auto";
      t.style.height = Math.min(t.scrollHeight, 46) + "px";
    } else if (t.hasAttribute("data-archive-general-note-id")) {
      updateArchiveNote(t.getAttribute("data-archive-general-note-id"), t.value);
    } else if (t.id === "listNoteInput") {
      state.listNote = t.value;
      scheduleSave();
    } else if (t.hasAttribute("data-rayon-name-id")) {
      renameRayon(t.getAttribute("data-rayon-name-id"), t.value);
    } else if (t.hasAttribute("data-product-name-id")) {
      renameProduct(t.getAttribute("data-product-name-id"), t.value);
    } else if (t.hasAttribute("data-piece-name-id")) {
      renamePiece(t.getAttribute("data-piece-name-id"), t.value);
    }
  }

  function handleChange(e) {
    var t = e.target;
    if (t.hasAttribute("data-rayon-color-id")) {
      updateRayonColor(t.getAttribute("data-rayon-color-id"), t.value);
    } else if (t.hasAttribute("data-product-rayon-id")) {
      changeProductRayon(t.getAttribute("data-product-rayon-id"), t.value);
    } else if (t.hasAttribute("data-product-piece-id")) {
      setProductPiece(t.getAttribute("data-product-piece-id"), t.value || null);
    } else if (t.hasAttribute("data-piece-color-id")) {
      updatePieceColor(t.getAttribute("data-piece-color-id"), t.value);
    }
  }

  /* ---------- Glisser-déposer : réordonner rayons/produits, et déplacer un produit
     d'une pièce à une autre (glisser-déposer entre zones différentes) ---------- */
  var dragState = null;

  function sortableIdValue(el) {
    var full = el.getAttribute("data-sortable-id") || "";
    return full.slice(full.indexOf(":") + 1);
  }

  function cssEscape(str) {
    if (window.CSS && CSS.escape) return CSS.escape(str);
    return String(str).replace(/[^a-zA-Z0-9_-]/g, function (ch) { return "\\" + ch; });
  }

  // S'assure que le rayon/pièce contenant ce produit n'est pas replié, pour qu'on
  // atterrisse bien dessus après avoir basculé le mode gestion.
  function clearDropzoneHighlights() {
    Array.prototype.forEach.call(document.querySelectorAll("[data-piece-dropzone]"), function (z) {
      z.style.boxShadow = "";
      z.style.background = "#fff";
    });
  }

  function onDragPointerDown(e) {
    if (e.isPrimary === false) return; // ignore un second doigt (multi-touch) pour éviter tout état incohérent
    var handle = e.target.closest("[data-drag-handle]");
    if (!handle) return;
    var row = handle.closest("[data-sortable-id]");
    if (!row) return;
    e.preventDefault();
    try { handle.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    startDragFromRow(row, e.pointerId, e.clientY);
  }

  // Empêche le navigateur mobile de reprendre la main sur le défilement pendant le
  // glisser (cause probable des blocages en cours de mouvement sur Android).
  var savedBodyOverflow = "";
  var savedHtmlOverflow = "";
  var bodyScrollLocked = false;
  function lockBodyScroll() {
    if (bodyScrollLocked) return;
    bodyScrollLocked = true;
    savedBodyOverflow = document.body.style.overflow;
    savedHtmlOverflow = document.documentElement.style.overflow;
    document.body.style.overflow = "hidden";
    document.documentElement.style.overflow = "hidden";
  }
  function unlockBodyScroll() {
    if (!bodyScrollLocked) return;
    bodyScrollLocked = false;
    document.body.style.overflow = savedBodyOverflow;
    document.documentElement.style.overflow = savedHtmlOverflow;
  }

  function startDragFromRow(row, pointerId, clientY) {
    if (dragState) {
      // Sécurité : un glisser précédent n'a pas été proprement clôturé (ex. écouteur
      // manqué). On le nettoie avant d'en démarrer un nouveau plutôt que de laisser
      // deux états de glisser coexister, ce qui bloque toute interaction ultérieure.
      teardownDragListeners();
      clearTimeout(dragState.watchdog);
      try {
        dragState.row.style.transform = "";
        dragState.row.style.position = "";
        dragState.row.style.zIndex = "";
        dragState.row.style.boxShadow = "";
        dragState.row.style.touchAction = "";
        dragState.siblings.forEach(function (sib) { sib.style.transform = ""; sib.style.transition = ""; });
      } catch (err) { /* l'élément a peut-être déjà été retiré du DOM par un re-rendu */ }
      clearDropzoneHighlights();
      dragState = null;
    }
    var group = row.getAttribute("data-sortable-group");
    var isPieces = group.indexOf("pieces:") === 0;
    var container = row.parentElement;
    if (!container) return false;
    var siblings = Array.prototype.filter.call(container.children, function (el) {
      return el.getAttribute && el.getAttribute("data-sortable-group") === group;
    });
    if (!isPieces && siblings.length < 2) return false;

    var origIndex = siblings.indexOf(row);
    var origRects = siblings.map(function (el) { return el.getBoundingClientRect(); });

    dragState = {
      row: row,
      group: group,
      isPieces: isPieces,
      originKey: isPieces ? group.slice("pieces:".length) : null,
      crossTarget: null,
      container: container,
      siblings: siblings,
      pointerId: pointerId,
      startY: clientY,
      origIndex: origIndex,
      origRects: origRects,
      rowHeight: (origRects[origIndex] && origRects[origIndex].height) || row.getBoundingClientRect().height,
      currentIndex: origIndex,
      dropzones: isPieces
        ? Array.prototype.map.call(document.querySelectorAll("[data-piece-dropzone]"), function (z) {
            return { key: z.getAttribute("data-piece-dropzone"), el: z, rect: z.getBoundingClientRect() };
          })
        : []
    };

    row.style.position = "relative";
    row.style.zIndex = "20";
    row.style.boxShadow = "0 6px 14px rgba(0,0,0,.18)";
    row.style.background = "#fff";
    row.style.borderRadius = "8px";
    row.style.touchAction = "none";
    siblings.forEach(function (sib, i) {
      if (i !== origIndex) sib.style.transition = "transform 120ms ease";
    });

    // Verrouille le défilement de la page tant que le doigt tient l'article : sur
    // Android, le navigateur reprend parfois la main sur le défilement en plein milieu
    // du geste malgré touch-action/preventDefault, ce qui fige le glisser. Ce verrou
    // agit à un niveau plus radical (CSS) et n'est jamais contourné.
    lockBodyScroll();

    document.addEventListener("pointermove", onDragPointerMove, { passive: false });
    document.addEventListener("pointerup", onDragPointerUp);
    document.addEventListener("pointercancel", onDragPointerUp);
    document.addEventListener("touchmove", preventScrollDuringDrag, { passive: false });
    // Filet de sécurité : si aucun événement de fin ne nous parvient jamais pour une
    // raison imprévue, on force la clôture du glisser après quelques secondes plutôt
    // que de rester bloqué indéfiniment.
    dragState.watchdog = setTimeout(function () { onDragPointerUp(); }, 8000);
    return true;
  }

  // Écouteur tactile brut, en plus des Pointer Events : sur certains Android, seul un
  // preventDefault() sur un événement touchmove NON PASSIF empêche de façon fiable le
  // navigateur de reprendre le défilement en cours de glissement.
  function preventScrollDuringDrag(e) {
    if (dragState) e.preventDefault();
  }

  /* ---------- Appui long : glisser-déposer accessible partout sur l'article,
     même hors mode gestion, sans poignée visible. Double-tap manuel (indépendant
     de l'événement natif dblclick, qui ne se déclenche pas fiablement ici car le
     clic simple provoque un re-rendu complet qui remplace le nœud DOM entre les
     deux clics). ---------- */
  var longPressTimer = null;
  var longPressCandidate = null;
  var suppressNextRowClick = false;
  var LONG_PRESS_MS = 420;
  var LONG_PRESS_MOVE_CANCEL_PX = 18;

  function onRowLongPressPointerDown(e) {
    if (e.isPrimary === false) return; // ignore un second doigt (multi-touch) pour éviter tout état incohérent
    if (e.target.closest("[data-drag-handle]")) return; // déjà géré par la poignée en mode gestion
    if (dragState) return;
    var row = e.target.closest("[data-sortable-id]");
    if (!row) return;

    var tag = e.target.tagName;
    if (tag === "TEXTAREA" || tag === "INPUT" || tag === "SELECT") return;

    longPressCandidate = { sortableId: row.getAttribute("data-sortable-id"), startX: e.clientX, startY: e.clientY, pointerId: e.pointerId };
    clearTimeout(longPressTimer);
    longPressTimer = setTimeout(function () {
      if (!longPressCandidate) return;
      var cand = longPressCandidate;
      longPressCandidate = null;
      // On requête à nouveau l'élément par son identifiant au moment précis où l'appui
      // long se déclenche, plutôt que de réutiliser la référence capturée au pointerdown :
      // si un re-rendu a eu lieu entre-temps (ex. une autre donnée a changé), l'ancien
      // nœud DOM est détaché et invisible — le glisser s'exécuterait alors dans le vide,
      // sans aucun effet visible à l'écran.
      var freshRow = appEl.querySelector('[data-sortable-id="' + cssEscape(cand.sortableId) + '"]');
      var started = freshRow ? startDragFromRow(freshRow, cand.pointerId, cand.startY) : false;
      if (started) {
        suppressNextRowClick = true;
        if (navigator.vibrate) { try { navigator.vibrate(15); } catch (err) { /* ignore */ } }
      }
      document.removeEventListener("pointermove", onLongPressPointerMove);
      document.removeEventListener("pointerup", onLongPressPointerUp);
      document.removeEventListener("pointercancel", onLongPressPointerUp);
    }, LONG_PRESS_MS);

    document.addEventListener("pointermove", onLongPressPointerMove);
    document.addEventListener("pointerup", onLongPressPointerUp);
    document.addEventListener("pointercancel", onLongPressPointerUp);
  }

  function onLongPressPointerMove(e) {
    if (!longPressCandidate) return;
    var dx = e.clientX - longPressCandidate.startX;
    var dy = e.clientY - longPressCandidate.startY;
    if (Math.sqrt(dx * dx + dy * dy) > LONG_PRESS_MOVE_CANCEL_PX) {
      cancelLongPress();
    }
  }

  function onLongPressPointerUp() {
    cancelLongPress();
  }

  function cancelLongPress() {
    clearTimeout(longPressTimer);
    longPressCandidate = null;
    document.removeEventListener("pointermove", onLongPressPointerMove);
    document.removeEventListener("pointerup", onLongPressPointerUp);
    document.removeEventListener("pointercancel", onLongPressPointerUp);
  }

  /* ---------- "Ma liste" : double-tap pour cocher un article, double-tap pour
     déverrouiller temporairement son champ libre (jamais de cadre visible, modifiable
     uniquement une fois déverrouillé). ---------- */
  var lastListTap = null;
  var LIST_DOUBLE_TAP_MS = 400;

  function onListRowPointerDown(e) {
    var noteEl = e.target.closest("[data-dbltap-note]");
    var checkEl = !noteEl && e.target.closest("[data-dbltap-check]");
    var target = noteEl || checkEl;
    if (!target) return;
    var kind = noteEl ? "note" : "check";
    var id = target.getAttribute(noteEl ? "data-dbltap-note" : "data-dbltap-check");
    var now = Date.now();
    if (lastListTap && lastListTap.kind === kind && lastListTap.id === id && (now - lastListTap.time) < LIST_DOUBLE_TAP_MS) {
      lastListTap = null;
      if (kind === "check") {
        toggleChecked(id);
      } else {
        unlockNoteEditing(id);
      }
    } else {
      lastListTap = { kind: kind, id: id, time: now };
    }
  }

  function unlockNoteEditing(productId) {
    ui.editingNoteId = productId;
    render();
    requestAnimationFrame(function () {
      var field = appEl.querySelector('textarea[data-note-id="' + cssEscape(productId) + '"]');
      if (field) {
        field.focus();
        var len = field.value.length;
        try { field.setSelectionRange(len, len); } catch (err) { /* ignore */ }
      }
    });
  }

  function relockNoteEditing() {
    if (!ui.editingNoteId) return;
    ui.editingNoteId = null;
    render();
  }

  function onDragPointerMove(e) {
    if (!dragState) return;
    e.preventDefault();
    var dy = e.clientY - dragState.startY;
    dragState.row.style.transform = "translateY(" + dy + "px)";

    if (dragState.isPieces) {
      var target = null;
      for (var k = 0; k < dragState.dropzones.length; k++) {
        var dz = dragState.dropzones[k];
        var top = k === 0 ? -Infinity : dz.rect.top;
        var bottom = k === dragState.dropzones.length - 1 ? Infinity : dz.rect.bottom;
        if (e.clientY >= top && e.clientY <= bottom) { target = dz; break; }
      }
      if (target) {
        clearDropzoneHighlights();
        if (target.key !== dragState.originKey) {
          target.el.style.boxShadow = "inset 0 0 0 2px #1E4632";
          target.el.style.background = "#EAF0EC";
          dragState.crossTarget = target.key;
        } else {
          dragState.crossTarget = null;
        }
      }
    }

    if (dragState.crossTarget && dragState.crossTarget !== dragState.originKey) {
      dragState.siblings.forEach(function (sib, i) { if (i !== dragState.origIndex) sib.style.transform = ""; });
      dragState.currentIndex = dragState.origIndex;
      return;
    }

    var origRect = dragState.origRects[dragState.origIndex];
    var draggedCenter = origRect.top + origRect.height / 2 + dy;
    var passedBelow = 0, passedAbove = 0;

    dragState.siblings.forEach(function (sib, i) {
      if (i === dragState.origIndex) return;
      var rect = dragState.origRects[i];
      var center = rect.top + rect.height / 2;
      if (i > dragState.origIndex && draggedCenter > center) {
        passedBelow++;
        sib.style.transform = "translateY(" + (-dragState.rowHeight) + "px)";
      } else if (i < dragState.origIndex && draggedCenter < center) {
        passedAbove++;
        sib.style.transform = "translateY(" + dragState.rowHeight + "px)";
      } else {
        sib.style.transform = "";
      }
    });

    dragState.currentIndex = dragState.origIndex + passedBelow - passedAbove;
  }

  function teardownDragListeners() {
    document.removeEventListener("pointermove", onDragPointerMove);
    document.removeEventListener("pointerup", onDragPointerUp);
    document.removeEventListener("pointercancel", onDragPointerUp);
    document.removeEventListener("touchmove", preventScrollDuringDrag, { passive: false });
    unlockBodyScroll();
  }

  function onDragPointerUp(e) {
    // Le nettoyage des écouteurs doit TOUJOURS s'exécuter, même si dragState est déjà
    // nul (pointerup/pointercancel peuvent se déclencher plusieurs fois, notamment quand
    // l'élément capturé est retiré du DOM par un re-rendu) — sinon les écouteurs
    // s'accumulent silencieusement sur document et finissent par entrer en conflit,
    // bloquant le glisser-déposer après quelques utilisations.
    teardownDragListeners();
    if (!dragState) return;
    clearTimeout(dragState.watchdog);
    clearDropzoneHighlights();

    var crossTarget = dragState.crossTarget;
    var originKey = dragState.originKey;
    var isPieces = dragState.isPieces;
    var productId = isPieces ? sortableIdValue(dragState.row) : null;
    var finalIndex = dragState.currentIndex;
    var changed = finalIndex !== dragState.origIndex;
    var group = dragState.group;
    var newOrderEls = null;

    if (changed && !(crossTarget && crossTarget !== originKey)) {
      newOrderEls = dragState.siblings.slice();
      newOrderEls.splice(dragState.origIndex, 1);
      newOrderEls.splice(finalIndex, 0, dragState.row);
    }

    dragState.row.style.transform = "";
    dragState.row.style.position = "";
    dragState.row.style.zIndex = "";
    dragState.row.style.boxShadow = "";
    dragState.row.style.touchAction = "";
    dragState.siblings.forEach(function (sib) {
      sib.style.transform = "";
      sib.style.transition = "";
    });

    dragState = null;

    if (isPieces && crossTarget && crossTarget !== originKey) {
      assignProductToPieceEnd(productId, crossTarget === "unassigned" ? null : crossTarget);
      return;
    }

    if (changed && newOrderEls) {
      var ids = newOrderEls.map(sortableIdValue);
      if (group === "rayons") {
        reorderRayons(ids);
      } else if (group.indexOf("products:") === 0) {
        reorderProductsInRayon(group.slice("products:".length), ids);
      } else if (group.indexOf("pieces:") === 0) {
        reorderProductsInPiece(originKey === "unassigned" ? null : originKey, ids);
      }
    }
  }

  /* ---------- Démarrage ---------- */
  document.addEventListener("DOMContentLoaded", function () {
    appEl = document.getElementById("app");
    appEl.addEventListener("click", handleClick);
    appEl.addEventListener("input", handleInput);
    appEl.addEventListener("change", handleChange);
    appEl.addEventListener("pointerdown", onDragPointerDown);
    appEl.addEventListener("pointerdown", onRowLongPressPointerDown);
    appEl.addEventListener("pointerdown", onListRowPointerDown);
    appEl.addEventListener("blur", function (e) {
      if (e.target && e.target.hasAttribute && e.target.hasAttribute("data-dbltap-note")) relockNoteEditing();
    }, true);
    render();
    load();
  });
})();
</script>
</body>
</html>
